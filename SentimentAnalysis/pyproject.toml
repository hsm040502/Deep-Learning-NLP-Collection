[project]
name = "sentiment-analysis-rnn"
version = "0.1.0"
description = "A RNN-based sentiment analysis model using PyTorch."
authors = [
    {name = "Your Name", email = "you@example.com"},
]
dependencies = [
    "torch>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.23.0",
    "nltk>=3.8.0",
    # "spacy>=3.0.0", # 可選，如果 NLTK 不足夠
    "scikit-learn>=1.2.0", # 用於計算 accuracy 等指標
]
requires-python = ">=3.10"

[project.scripts]
analyze-sentiments = "src.main:main_cli" # 假設 main.py 中的 CLI 進入點是 main_cli

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "PL", "PTH"] # E/W (pycodestyle), F (Pyflakes), I (isort), UP (pyupgrade), PL (Pylint), PTH (flake8-use-pathlib)
ignore = ["E501"] # 忽略行過長，有時難以避免

[tool.ruff.format]
quote-style = "double" # 使用雙引號

[tool.uv.sources]
# 如有需要，可指定私有 pypi 來源
# private-pypi = { url = "https://my-private-pypi.org/simple" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
